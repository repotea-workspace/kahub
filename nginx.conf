worker_processes auto;
error_log /dev/stderr notice;
pid /dev/shm/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  keepalive_timeout 65;

  client_body_temp_path /dev/shm/client-temp;
  proxy_temp_path /dev/shm/proxy-temp;
  fastcgi_temp_path /dev/shm/fastcgi-temp;
  uwsgi_temp_path /dev/shm/uwsgi-temp;
  scgi_temp_path /dev/shm/scgi-temp;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location = / {
      try_files /index.html =404;
    }

    location = /styles.css {
      try_files /styles.css =404;
    }

    location = /terms {
      default_type text/html;
      try_files /terms.html =404;
    }

    location = /terms.html {
      try_files /terms.html =404;
    }

    location = /privacy {
      default_type text/html;
      try_files /privacy.html =404;
    }

    location = /privacy.html {
      try_files /privacy.html =404;
    }

    location = /refund {
      default_type text/html;
      try_files /refund.html =404;
    }

    location = /refund.html {
      try_files /refund.html =404;
    }

    location / {
      return 404;
    }
  }
}
